<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNUTULMAYACAK ŞEHİTLERİMİZ</title>
    <meta name="description" content="Türk şehitlerimizin isimlerini burada bulabilirsiniz. Şehitlerimizi ve şehit ailelerini unutmuyoruz.">
    <meta name="keywords" content="şehitlerimiz, şehit isimleri, şehit aileleri, Mehmetçik, unutulmayacaklar">
    <meta name="author" content="Unutulmayacaklar">
    <meta name="rights" content="Tüm içerik yalnızca anma amaçlıdır.">
    <link rel="icon" type="image/jpeg" href="siyahkurdele.jpg">
    <meta property="og:title" content="UNUTULMAYACAK ŞEHİTLERİMİZ">
    <meta property="og:description" content="Türk şehitlerimizin isimlerini burada bulabilirsiniz. Şehitlerimizi ve şehit ailelerini unutmuyoruz.">
    <meta property="og:image" content="siyahkurdele.png">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://unutulmayacaklar.onrender.com https://www.mehmetcik.org.tr; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">

    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <link rel="canonical" href="https://unutulmayacaklar.github.io/unutulmayacaklar/">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .left-text {
            position: fixed;
            left: 0;
            top: 0;
            width: 70px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .kurdele {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 140px;
            height: 140px;
            background-image: url('siyahkurdele.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 0;
            pointer-events: none;
        }

        .scroll-container {
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            position: relative;
            height: 100vh;
            z-index: 1;
            margin-left: 90px;
        }

        .scroll-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
        }

        .scroll-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .name-item {
            font-size: 2rem;
            font-weight: 600;
            padding: 1.2rem 0;
            text-align: center;
            letter-spacing: 0.05em;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body>
    <div class="left-text">UNUTULMAYACAKSINIZ</div>
    <div class="kurdele"></div>
    <div class="scroll-container">
        <div class="scroll-wrapper" id="scrollWrapper"></div>
    </div>



    <script>
        const BACKEND_URL = 'https://unutulmayacaklar.onrender.com';

        const state = {
            names: [],
            y: 0,
            speed: 0.3,
            targetSpeed: 1.0,
            lastTime: performance.now(),
            initialized: false,
            started: false
        };

        const wrapper = document.getElementById('scrollWrapper');
        const statusEl = document.getElementById('status');

        function showStatus(msg) {
            statusEl.textContent = msg;
            statusEl.classList.add('show');
            setTimeout(() => statusEl.classList.remove('show'), 2000);
        }

        function createNameItem(name) {
            const div = document.createElement('div');
            div.className = 'name-item';
            div.textContent = name;
            return div;
        }

        function buildScrollContent(names) {
            wrapper.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'scroll-content';
            container.id = 'scrollContent';

            names.forEach(name => container.appendChild(createNameItem(name)));
            wrapper.appendChild(container);

            const clone = container.cloneNode(true);
            wrapper.appendChild(clone);
        }

        async function loadNames() {
            const res = await fetch('data/names.json');
            if (!res.ok) throw new Error('names.json not found');
            const data = await res.json();
            state.names = data.names || [];
        }

        async function logBackend(path, extra = {}) {
            try {
                const payload = {
                    userAgent: navigator.userAgent,
                    path: path,
                    referrer: document.referrer || 'direct',
                    ...extra
                };
                await fetch(BACKEND_URL + '/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch {
                // backend yoksa sessiz kal
            }
        }

        async function logConsoleToBackend(details = {}) {
            try {
                const payload = {
                    userAgent: navigator.userAgent,
                    details: {
                        ...details,
                        timestamp: new Date().toISOString()
                    }
                };
                await fetch(BACKEND_URL + '/api/console', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch {
                // backend yoksa sessiz kal
            }
        }

        window.addEventListener('error', function(e) {
            if (e && e.target && e.target.src && e.target.src.includes(BACKEND_URL)) {
                e.stopPropagation();
            }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && typeof e.reason === 'string' && e.reason.includes('Failed to fetch')) {
                e.preventDefault();
            }
        });

        let animId;
        function animate(currentTime) {
            const delta = currentTime - state.lastTime;
            state.lastTime = currentTime;

            if (!state.started) {
                if (delta > 0) {
                    state.started = true;
                    state.lastTime = currentTime;
                }
                wrapper.style.transform = `translateY(${state.y}px)`;
                animId = requestAnimationFrame(animate);
                return;
            }

            if (state.speed < state.targetSpeed) {
                state.speed += delta * 0.015;
                if (state.speed > state.targetSpeed) {
                    state.speed = state.targetSpeed;
                }
            }

            state.y -= state.speed * delta * 0.06;

            const content = document.getElementById('scrollContent');
            if (content && content.offsetHeight > 0) {
                const fullHeight = content.offsetHeight / 2;
                if (state.y <= -fullHeight) {
                    state.y += fullHeight;
                }
                if (state.y > 0) {
                    state.y -= fullHeight;
                }
            }

            wrapper.style.transform = `translateY(${state.y}px)`;
            animId = requestAnimationFrame(animate);
        }

        async function init() {
            await loadNames();
            buildScrollContent(state.names);
            animId = requestAnimationFrame(animate);
            state.initialized = true;
            await logBackend('/');
        }

        const devToolsThreshold = 160;
        let devToolsDetected = false;

        function checkDevTools() {
            if (devToolsDetected) return;
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            if (widthDiff > devToolsThreshold || heightDiff > devToolsThreshold) {
                devToolsDetected = true;
                logConsoleToBackend({ type: 'devtools_open', widthDiff, heightDiff });
            }
        }

        window.addEventListener('resize', checkDevTools);
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) {
                checkDevTools();
            }
            if (e.key === 'F12') {
                setTimeout(checkDevTools, 100);
            }
        });

        setTimeout(() => {
            checkDevTools();
            window.removeEventListener('resize', checkDevTools);
        }, 10000);

        init();

        const asciiArt = `                                                                           
                       -:          .           -.                          
                        =+.      -@@@*      .=@%                           
                         -@      #@@@+  -%@@@+                             
                           .@-    +@@@@@@@@#:                               
                             %=  -@@@@@@@                                   
                              @@=@@@@@@@@                                   
                             ::%@@#*@@@@@@                                  
                             *. #@=@@@@@@@*                                 
                             =   -@@@@@@@@@.                                
                             +.  .@@@@*=@@@+                                
                              +:.:@@@-  .@@@.                               
                                 :@@%     @@#                               
                                 #@@      :@@.                              
                                 @@        %@.                              
                                .@#        =@+                              
                            *#@@@@@@@@@@@@@@@@@@@-                          
               -+++: .+ :+ .+++-    :+ :+: =++: :+    -++=  +..+.           
               @@ %@.=@ *@ =@=:@-    @@@# +@:=@ *@.  .@# %-.@=-@=           
               @@ %@.=@ *@ =@@@%      @#  +@:=@ *@.  .@#   .@=-@=           
               #@@@# :@@@@ -@-@@.     @+  :@@@% +@@@* @@@@- @@@@:           
                                                                               `;

        console.clear();
        console.log(asciiArt);
        console.log('%c Şehitlerimizin anısına kurulan bu yapıda tüm istekler izlenmekte ve engellenmektedir. ', 'color: #fff; background: #c00; padding: 6px 10px; font-weight: bold;');
        console.log('%c Bu adreste aradığınızı bulamayacaksınız. ', 'color: #fff; background: #c00; padding: 6px 10px; font-weight: bold;');

        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        console.log = function(...args) {
            if (args.some(arg => typeof arg === 'string' && arg.includes('sehit'))) {
                return;
            }
            originalConsoleLog.apply(console, args);
        };
        console.error = function(...args) {
            if (args.some(arg => typeof arg === 'string' && arg.includes('sehit'))) {
                return;
            }
            originalConsoleError.apply(console, args);
        };
        console.warn = function(...args) {
            if (args.some(arg => typeof arg === 'string' && arg.includes('sehit'))) {
                return;
            }
            originalConsoleWarn.apply(console, args);
        };

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (
                (e.ctrlKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) ||
                (e.metaKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) ||
                (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                (e.metaKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                e.key === 'F12' ||
                (e.ctrlKey && e.key === 'i') ||
                (e.metaKey && e.key === 'i')
            ) {
                e.preventDefault();
                return false;
            }
        });

        const integrityCheck = setInterval(() => {
            const wrapper = document.getElementById('scrollWrapper');
            if (!wrapper) {
                return;
            }
            const content = document.getElementById('scrollContent');
            if (content && content.children.length > 0) {
                const firstText = content.children[0]?.textContent?.trim();
                if (!firstText || firstText.length < 2) {
                    // silent integrity issue
                }
            }
        }, 3000);
    </script>
</body>
</html>
