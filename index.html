    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .left-text {
            position: fixed;
            left: 0;
            top: 84px;
            width: 70px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .kurdele {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 120px;
            height: 120px;
            background-image: url('siyahkurdele.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 4;
            pointer-events: none;
            opacity: 0.85;
        }

        .site-logo {
            position: fixed;
            top: 14px;
            left: 14px;
            width: 120px;
            height: auto;
            z-index: 7;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: block;
        }

        .site-logo:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .site-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .scroll-container {
            width: 100%;
            max-width: 820px;
            overflow: hidden;
            position: relative;
            height: 100vh;
            z-index: 1;
            margin-left: 90px;
            padding-bottom: 80px;
        }

        .scroll-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
        }

        .scroll-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .name-item {
            display: inline-block;
            width: fit-content;
            max-width: 100%;
            font-size: 2rem;
            font-weight: 300;
            padding: 1.2rem 0.6rem;
            text-align: center;
            letter-spacing: 0.06em;
            white-space: nowrap;
            color: #f2f2f2;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            position: relative;
            transition: color 0.35s ease, transform 0.35s ease, letter-spacing 0.35s ease;
            cursor: pointer;
        }

        .name-item.active {
            color: #fff;
            transform: scale(1.06);
            letter-spacing: 0.12em;
            font-weight: 400;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 90px;
            right: 0;
            text-align: center;
            padding: 18px 20px;
            color: #777;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            font-weight: 300;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(to top, #000 60%, transparent);
        }

        .detail-panel {
            position: fixed;
            top: 50%;
            right: 32px;
            transform: translateY(-50%) translateX(40px);
            width: 340px;
            background: rgba(12, 12, 12, 0.97);
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .detail-panel.show {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            pointer-events: auto;
        }

        .detail-portrait {
            position: relative;
            width: 100%;
            height: 260px;
            background: #0a0a0a;
            overflow: hidden;
            border-bottom: 1px solid #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-portrait img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .detail-portrait .fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
        }

        .detail-portrait .fallback .mark {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .detail-body {
            padding: 22px 20px 26px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.7rem;
            letter-spacing: 0.35em;
            color: #999;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .detail-name {
            font-size: 1.5rem;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.04em;
            line-height: 1.35;
        }

        .detail-divider {
            width: 46px;
            height: 1px;
            background: #444;
            margin: 16px auto;
        }

        .detail-oath {
            font-size: 0.92rem;
            color: #cfcfcf;
            line-height: 1.7;
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        @media (max-width: 820px) {
            .scroll-container {
                margin-left: 60px;
                max-width: 100%;
                padding-left: 10px;
                padding-right: 10px;
            }
            .left-text {
                width: 50px;
                font-size: 1.6rem;
                top: 72px;
            }
            .site-logo {
                width: 90px;
            }
            .name-item {
                font-size: 1.6rem;
                padding: 1.05rem 0.4rem;
            }
            .kurdele {
                width: 90px;
                height: 90px;
                top: 16px;
                right: 16px;
            }
            .footer {
                left: 60px;
                font-size: 0.72rem;
                padding: 14px 12px;
            }
        }

        @media (max-width: 560px) {
            .scroll-container {
                margin-left: 48px;
                padding-left: 6px;
                padding-right: 6px;
            }
            .left-text {
                width: 38px;
                font-size: 1.2rem;
                top: 66px;
            }
            .site-logo {
                width: 70px;
                top: 12px;
                left: 12px;
            }
            .kurdele {
                width: 70px;
                height: 70px;
                top: 14px;
                right: 14px;
            }
            .name-item {
                font-size: 1.6rem;
                padding: 1.05rem 0.4rem;
                letter-spacing: 0.02em;
            }
            .footer {
                left: 48px;
                font-size: 0.7rem;
                padding: 14px 10px;
                letter-spacing: 0.06em;
            }
            .detail-panel {
                width: calc(100% - 20px);
                right: 10px;
                left: 10px;
                top: auto;
                bottom: 74px;
                transform: translateY(40px);
                max-height: 72vh;
                overflow-y: auto;
                background: rgba(8, 8, 8, 0.98);
                transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .detail-panel.show {
                transform: translateY(0);
            }
            .detail-portrait {
                height: 250px;
            }
        }

        .music-toggle {
            position: fixed;

            display: flex;
            align-items: center;

            cursor: pointer;
            z-index: 9;
            opacity: 0.75;

            padding: 0;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);

        .music-toggle:hover {

        .music-toggle img {
            width: 22px;

            filter: invert(1);

        .music-toggle.playing {
            opacity: 1;
            border-color: #5a5a5a;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
        }

        @media (max-width: 560px) {
            .music-toggle {

                width: 40px;

            .music-toggle img {
                width: 20px;
                height: 20px;

    <a class="site-logo" href="https://www.mehmetcik.org.tr" target="_blank" rel="noopener noreferrer" title="Mehmetçik Vakfı">

    </a>
    <div class="left-text">UNUTULMAYACAKSINIZ</div>
    <div class="kurdele"></div>
    <div class="scroll-container">
        <div class="scroll-wrapper" id="scrollWrapper"></div>
    </div>

    <div class="detail-panel" id="detailPanel">
        <div class="detail-portrait" id="detailPortrait"></div>
        <div class="detail-body">
            <div class="detail-label">ŞEHİDİMİZ</div>
            <div class="detail-name" id="detailName"></div>
            <div class="detail-divider"></div>
            <div class="detail-oath">Şehitler Ölmez Vatan Bölünmez</div>
        </div>
    </div>

    <div class="footer">Şehitlerimizin hatırasına</div>

    <button class="music-toggle" id="musicToggle" type="button" aria-label="Müziği aç / kapat" title="Müziği aç / kapat">
        <img id="musicIcon" src="media/sound-on.svg" alt="">
    </button>

    <audio id="bgMusic" loop preload="auto" autoplay muted playsinline src="media/background-music.mp3"></audio>

    <script>
        const BACKEND_URL = 'https://unutulmayacaklar.onrender.com';

        const state = {
            people: [],
            y: 0,
            speed: 0.3,
            targetSpeed: 0.8,
            currentSpeed: 0,
            lastTime: performance.now(),
            initialized: false,
            started: false,
            paused: false,
            activeIndex: -1,
            loadedPhotos: {}
        };

        const wrapper = document.getElementById('scrollWrapper');
        const panel = document.getElementById('detailPanel');
        const panelPortrait = document.getElementById('detailPortrait');
        const panelName = document.getElementById('detailName');
        let hideTimer = null;

        panel.addEventListener('mouseenter', cancelHide);
        panel.addEventListener('mouseleave', scheduleHide);

        // Mobil: panel açıkken arka plana (siyaha) dokunulunca kapat.
        // İsme ve panele yapılan dokunuşlar hariç tutulur.
        document.addEventListener('click', function(e) {
            if (window.innerWidth > 560) return;
            if (!panel.classList.contains('show')) return;
            if (panel.contains(e.target)) return;
            if (e.target.closest && e.target.closest('.name-item')) return;
            unfocus();
        });

        function normalizePerson(raw, index) {
            if (typeof raw === 'string') {
                return { name: raw, photo: null, url: null, index: index };
            }
            return {
                name: raw.name || raw.ad || '',
                photo: raw.photo || raw.fotograf || null,
                url: raw.url || raw.link || null,
                index: index
            };
        }

        function safeHttp(u) {
            if (typeof u !== 'string') return null;
            return /^https?:\/\//i.test(u) ? u : null;
        }

        function buildScrollContent(people) {
            wrapper.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'scroll-content';
            container.id = 'scrollContent';

            people.forEach(function(person, i) {
                const div = document.createElement('div');
                div.className = 'name-item';
                div.textContent = person.name;
                div.setAttribute('data-index', i);
                div.addEventListener('mouseenter', function() { cancelHide(); focusPerson(i); });
                div.addEventListener('mouseleave', function() { scheduleHide(); });
                container.appendChild(div);
            });
            wrapper.appendChild(container);

            const clone = container.cloneNode(true);
            clone.querySelectorAll('.name-item').forEach(function(node, i) {
                node.addEventListener('mouseenter', function() { cancelHide(); focusPerson(i); });
                node.addEventListener('mouseleave', function() { scheduleHide(); });
            });
            wrapper.appendChild(clone);
        }

        function bindPhotoClick(person) {
            const img = panelPortrait.querySelector('img');
            const url = safeHttp(person.url);
            if (img && url) {
                img.style.cursor = 'pointer';
                img.title = 'Mehmetçik Vakfı sitesinde görüntüle';
                img.onclick = function() {
                    window.open(url, '_blank', 'noopener');
                };
            }
        }

        function showPhoto(person) {
            const photo = safeHttp(person.photo);
            if (state.loadedPhotos[person.index] !== undefined) {
                panelPortrait.innerHTML = state.loadedPhotos[person.index];
                bindPhotoClick(person);
                return;
            }
            if (photo) {
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.decoding = 'async';
                img.alt = person.name;
                img.onload = function() {
                    state.loadedPhotos[person.index] = panelPortrait.innerHTML;
                    bindPhotoClick(person);
                };
                img.onerror = function() {
                    panelPortrait.innerHTML = '<div class="fallback"><div class="mark">★</div><div>Şehidimizi rahmetle anıyoruz</div></div>';
                    state.loadedPhotos[person.index] = panelPortrait.innerHTML;
                };
                img.src = photo;
                panelPortrait.innerHTML = '';
                panelPortrait.appendChild(img);
                bindPhotoClick(person);
            } else {
                panelPortrait.innerHTML = '<div class="fallback"><div class="mark">★</div><div>Şehidimizi rahmetle anıyoruz</div></div>';
                state.loadedPhotos[person.index] = panelPortrait.innerHTML;
            }
        }

        function scheduleHide() {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(unfocus, 400);
        }

        function cancelHide() {
            clearTimeout(hideTimer);
        }

        function positionPanel(nameEl) {
            if (window.innerWidth <= 560) {
                panel.style.left = '';
                panel.style.top = '';
                panel.style.right = '';
                return;
            }
            const vw = window.innerWidth, vh = window.innerHeight;
            const pw = 340, gap = 14, ph = panel.offsetHeight || 460;
            const rect = nameEl.getBoundingClientRect();
            let left = rect.right + gap;
            if (left + pw > vw - 140) left = vw - pw - 32;
            if (left < 140) left = 140;
            panel.style.left = left + 'px';
            panel.style.right = 'auto';
            let top = rect.top + rect.height / 2;
            top = Math.max(150 + ph / 2, Math.min(top, vh - ph / 2 - 10));
            panel.style.top = top + 'px';
        }

        function focusPerson(index) {
            const realIndex = index % state.people.length;
            const person = state.people[realIndex];
            if (!person) return;
            cancelHide();
            state.paused = true;
            state.activeIndex = realIndex;

            const items = wrapper.querySelectorAll('.name-item');
            items.forEach(function(it) {
                it.classList.toggle('active', parseInt(it.getAttribute('data-index'), 10) === realIndex);
            });

            panelName.textContent = person.name;
            showPhoto(person);
            positionPanel(items[realIndex] || items[realIndex % items.length]);
            panel.classList.add('show');
        }

        function unfocus() {
            clearTimeout(hideTimer);
            state.paused = false;
            state.activeIndex = -1;
            const items = wrapper.querySelectorAll('.name-item');
            items.forEach(function(it) { it.classList.remove('active'); });
            panel.classList.remove('show');
        }

        async function loadNames() {
            const res = await fetch('data/names.json');
            if (!res.ok) throw new Error('names.json not found');
            const data = await res.json();
            const raw = data.names || data.people || [];
            state.people = raw.map(normalizePerson);
        }

        async function logBackend(path, extra) {
            extra = extra || {};
            try {
                const payload = {
                    userAgent: navigator.userAgent,
                    path: path,
                    referrer: document.referrer || 'direct'
                };
                Object.keys(extra).forEach(function(k) { payload[k] = extra[k]; });
                await fetch(BACKEND_URL + '/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { /* sessiz */ }
        }

        async function logConsoleToBackend(details) {
            details = details || {};
            try {
                const payload = {
                    userAgent: navigator.userAgent,
                    details: Object.assign({ timestamp: new Date().toISOString() }, details)
                };
                await fetch(BACKEND_URL + '/api/console', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { /* sessiz */ }
        }

        window.addEventListener('error', function(e) {
            if (e && e.target && e.target.src && e.target.src.includes(BACKEND_URL)) {
                e.stopPropagation();
            }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && typeof e.reason === 'string' && e.reason.includes('Failed to fetch')) {
                e.preventDefault();
            }
        });

        let animId;
        function animate(currentTime) {
            const delta = currentTime - state.lastTime;
            state.lastTime = currentTime;

            if (!state.started) {
                if (delta > 0) {
                    state.started = true;
                    state.lastTime = currentTime;
                }
                wrapper.style.transform = 'translateY(' + state.y + 'px)';
                animId = requestAnimationFrame(animate);
                return;
            }

            if (state.paused) {
                if (state.currentSpeed > 0) {
                    state.currentSpeed -= delta * 0.004;
                    if (state.currentSpeed < 0) state.currentSpeed = 0;
                }
            } else {
                if (state.currentSpeed < state.targetSpeed) {
                    state.currentSpeed += delta * 0.002;
                    if (state.currentSpeed > state.targetSpeed) state.currentSpeed = state.targetSpeed;
                }
            }

            if (!state.paused) {
                state.y -= state.currentSpeed * delta * 0.06;
            }

            const content = document.getElementById('scrollContent');
            if (content && content.offsetHeight > 0) {
                const fullHeight = content.offsetHeight / 2;
                if (state.y <= -fullHeight) {
                    state.y += fullHeight;
                }
                if (state.y > 0) {
                    state.y -= fullHeight;
                }
            }

            wrapper.style.transform = 'translateY(' + state.y + 'px)';
            animId = requestAnimationFrame(animate);
        }

        async function init() {
            await loadNames();
            buildScrollContent(state.people);
            animId = requestAnimationFrame(animate);
            state.initialized = true;
            await logBackend('/');
        }

        const devToolsThreshold = 160;
        let devToolsDetected = false;

        function checkDevTools() {
            if (devToolsDetected) return;
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            if (widthDiff > devToolsThreshold || heightDiff > devToolsThreshold) {
                devToolsDetected = true;
                logConsoleToBackend({ type: 'devtools_open', widthDiff: widthDiff, heightDiff: heightDiff });
            }
        }

        window.addEventListener('resize', checkDevTools);
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) {
                checkDevTools();
            }
            if (e.key === 'F12') {
                setTimeout(checkDevTools, 100);
            }
        });

        setTimeout(() => {
            checkDevTools();
            window.removeEventListener('resize', checkDevTools);
        }, 10000);

        init();

        const asciiArt = "                                                                           \n" +
            "                       -:          .           -.                                          \n" +
            "                        =+.      -@@@*      .=@%                                           \n" +
            "                         -@      #@@@+  -%@@@+                                             \n" +
            "                           .@-    +@@@@@@@@#:                                               \n" +
            "                             %=  -@@@@@@@                                                   \n" +
            "                              @@=@@@@@@@@                                                   \n" +
            "                             ::%@@#*@@@@@@                                                  \n" +
            "                             *. #@=@@@@@@@*                                                 \n" +
            "                             =   -@@@@@@@@@.                                                \n" +
            "                             +.  .@@@@*=@@@+                                                \n" +
            "                              +:.:@@@-  .@@@.                                               \n" +
            "                                 :@@%     @@#                                               \n" +
            "                                 #@@      :@@.                                              \n" +
            "                                 @@        %@.                                              \n" +
            "                                .@#        =@+                                              \n" +
            "                            *#@@@@@@@@@@@@@@@@@@@-                                          \n" +
            "               -+++: .+ :+ .+++-    :+ :+: =++: :+    -++=  +..+.                         \n" +
            "               @@ %@.=@ *@ =@=:@-    @@@# +@:=@ *@.  .@# %-.@=-@=                         \n" +
            "               @@ %@.=@ *@ =@@@%      @#  +@:=@ *@.  .@#   .@=-@=                         \n" +
            "               #@@@# :@@@@ -@-@@.     @+  :@@@% +@@@* @@@@- @@@@:                         \n";

        console.clear();
        console.log(asciiArt);
        console.log('%c Şehitlerimizin anısına kurulan bu yapıda tüm istekler izlenmekte ve engellenmektedir. ', 'color: #fff; background: #555; padding: 6px 10px; font-weight: bold;');
        console.log('%c Bu adreste aradığınızı bulamayacaksınız. ', 'color: #fff; background: #555; padding: 6px 10px; font-weight: bold;');

        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        console.log = function() {
            const args = Array.prototype.slice.call(arguments);
            if (args.some(function(arg) { return typeof arg === 'string' && arg.includes('sehit'); })) return;
            originalConsoleLog.apply(console, args);
        };
        console.error = function() {
            const args = Array.prototype.slice.call(arguments);
            if (args.some(function(arg) { return typeof arg === 'string' && arg.includes('sehit'); })) return;
            originalConsoleError.apply(console, args);
        };
        console.warn = function() {
            const args = Array.prototype.slice.call(arguments);
            if (args.some(function(arg) { return typeof arg === 'string' && arg.includes('sehit'); })) return;
            originalConsoleWarn.apply(console, args);
        };

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (
                (e.ctrlKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) ||
                (e.metaKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) ||
                (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                (e.metaKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
                e.key === 'F12' ||
                (e.ctrlKey && e.key === 'i') ||
                (e.metaKey && e.key === 'i')
            ) {
                e.preventDefault();
                return false;
            }
        });

        const integrityCheck = setInterval(() => {
            const content = document.getElementById('scrollContent');
            if (content && content.children.length > 0) {
                const firstText = content.children[0] && content.children[0].textContent ? content.children[0].textContent.trim() : '';
                if (!firstText || firstText.length < 2) { /* silent */ }
            }
        }, 3000);

        // Arka plan müziği: siteye girişte sessiz (muted) başlar, sağ alttaki ikona
        // tıklayınca ses açılır ve SVG değişir. Tarayıcılar sesli otomatik çalmayı
        // engellediği için önce sessiz başlatılır; ilk etkileşimde de garanti edilir.
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        let soundOn = false;

        function syncIcon() {
            musicIcon.src = soundOn ? 'media/sound-on.svg' : 'media/sound-off.svg';
            musicToggle.classList.toggle('playing', !bgMusic.paused);
        }

        function tryPlayMuted() {
            bgMusic.muted = true;
            const p = bgMusic.play();
            if (p && typeof p.then === 'function') {
                p.catch(function() { /* otomatik çalma engellendi */ });
            }
        }

        window.addEventListener('load', tryPlayMuted);

        // Otomatik çalma tamamen engellenmişse, kullanıcı ilk kez etkileşimde
        // bulununca sessiz olarak yine de başlat.
        function ensureStartOnce() {
            if (bgMusic.paused) tryPlayMuted();
            document.removeEventListener('pointerdown', ensureStartOnce);
            document.removeEventListener('keydown', ensureStartOnce);
            syncIcon();
        }
        document.addEventListener('pointerdown', ensureStartOnce);
        document.addEventListener('keydown', ensureStartOnce);

        musicToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            if (bgMusic.paused) {
                bgMusic.play().catch(function() {});
            }
            soundOn = !soundOn;
            bgMusic.muted = !soundOn;
            syncIcon();
        });

        bgMusic.addEventListener('play', syncIcon);
        bgMusic.addEventListener('pause', syncIcon);

        syncIcon();
    </script>
</body>
</html>
